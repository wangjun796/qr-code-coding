<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本二维码传输工具</title>
    <script src="libs.bundle.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 15px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 10px 10px 0 0;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab.active {
            background: white;
            color: #667eea;
            font-weight: bold;
        }
        .panel {
            background: white;
            border-radius: 0 0 10px 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
        }
        .panel.active {
            display: block;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            transition: border-color 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn-secondary {
            background: #6c757d;
            margin-left: 10px;
        }
        .qr-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        .qr-item {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .qr-item canvas {
            border: 2px solid #e0e0e0;
            border-radius: 4px;
        }
        .qr-item p {
            margin-top: 8px;
            color: #666;
            font-size: 12px;
        }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9fa;
        }
        .upload-area:hover {
            background: #e9ecef;
            border-color: #764ba2;
        }
        .upload-area.dragover {
            background: #e7f3ff;
            border-color: #764ba2;
        }
        .preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }
        .preview-item {
            position: relative;
            width: 150px;
            height: 150px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }
        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .preview-item .remove-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255,0,0,0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }
        .info-box {
            padding: 15px;
            background: #e7f3ff;
            border-left: 4px solid #667eea;
            border-radius: 4px;
            margin: 20px 0;
        }
        .info-box h4 {
            color: #667eea;
            margin-bottom: 8px;
        }
        .info-box ul {
            margin-left: 20px;
            color: #555;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .stat-item {
            padding: 15px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            text-align: center;
        }
        .stat-item .value {
            font-size: 24px;
            font-weight: bold;
        }
        .stat-item .label {
            font-size: 12px;
            opacity: 0.9;
        }
        .progress {
            margin: 20px 0;
        }
        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }
        .error {
            color: #dc3545;
            padding: 10px;
            background: #f8d7da;
            border-radius: 4px;
            margin: 10px 0;
        }
        .success {
            color: #155724;
            padding: 10px;
            background: #d4edda;
            border-radius: 4px;
            margin: 10px 0;
        }
        #fileInput {
            display: none;
        }
        .options {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .option-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .option-item label {
            margin: 0;
            cursor: pointer;
        }
        select {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 文本二维码传输工具</h1>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('encode')">📤 编码 (文本→二维码)</button>
            <button class="tab" onclick="switchTab('decode')">📥 解码 (图片→文本)</button>
        </div>

        <!-- 编码面板 -->
        <div id="encode-panel" class="panel active">
            <div class="info-box">
                <h4>使用说明</h4>
                <ul>
                    <li>输入要传输的文本内容</li>
                    <li>启用压缩可减少数据量（推荐）</li>
                    <li>长文本会自动分片成多个二维码</li>
                    <li>截图时请确保二维码完整清晰</li>
                </ul>
            </div>

            <div class="form-group">
                <label>输入文本：</label>
                <textarea id="inputText" rows="8" placeholder="在此输入要传输的文本内容..."></textarea>
            </div>

            <div class="options">
                <div class="option-item">
                    <input type="checkbox" id="enableCompression" checked>
                    <label for="enableCompression">启用 LZ 压缩</label>
                </div>
                <div class="option-item">
                    <label for="errorCorrection">纠错级别：</label>
                    <select id="errorCorrection">
                        <option value="L">L (7%)</option>
                        <option value="M" selected>M (15%)</option>
                        <option value="Q">Q (25%)</option>
                        <option value="H">H (30%)</option>
                    </select>
                </div>
                <div class="option-item">
                    <label for="qrSize">二维码尺寸：</label>
                    <select id="qrSize">
                        <option value="200">200x200</option>
                        <option value="300" selected>300x300</option>
                        <option value="400">400x400</option>
                        <option value="500">500x500</option>
                    </select>
                </div>
            </div>

            <button class="btn" onclick="encodeText()">生成二维码</button>
            <button class="btn btn-secondary" onclick="clearEncode()">清空</button>

            <div id="encodeStats" class="stats" style="display:none;"></div>
            <div id="encodeActions" style="display:none; margin-top:15px;">
                <button class="btn" onclick="downloadAllQR()">💾 下载全部二维码 (JPG)</button>
            </div>
            <div id="qrContainer" class="qr-container"></div>
        </div>

        <!-- 解码面板 -->
        <div id="decode-panel" class="panel">
            <div class="info-box">
                <h4>使用说明</h4>
                <ul>
                    <li>点击上传区域或拖拽图片到此处</li>
                    <li>支持 Ctrl+V 直接粘贴剪贴板中的图片</li>
                    <li>支持多张图片（分片二维码）</li>
                    <li>系统会自动识别并重组文本</li>
                    <li>支持 JPG、PNG、BMP 格式</li>
                </ul>
            </div>

            <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()" tabindex="0">
                <h3>📷 点击上传、拖拽或 Ctrl+V 粘贴图片</h3>
                <p style="color:#666; margin-top:10px;">支持多张图片（分片二维码）</p>
            </div>
            <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFiles(this.files)">

            <div id="previewContainer" class="preview-container"></div>

            <div style="margin-top:20px;">
                <button class="btn" onclick="decodeImages()">开始解码</button>
                <button class="btn" style="background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%);margin-left:10px;" onclick="decodeMultiQR()">🔍 一图多码解码</button>
                <span id="decoderInfo" style="margin-left:15px;color:#666;font-size:13px;vertical-align:middle;"></span>
                <button class="btn btn-secondary" onclick="clearDecode()">清空</button>
            </div>

            <div id="decodeProgress" class="progress" style="display:none;">
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill" style="width:0%"></div>
                </div>
                <p id="progressText" style="margin-top:8px; color:#666;"></p>
            </div>

            <div id="decodeResult" style="margin-top:20px;"></div>
        </div>
    </div>

    <script>
        // 切换标签页
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            
            if (tab === 'encode') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('encode-panel').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('decode-panel').classList.add('active');
                // 显示当前使用的解码器
                const decoderInfo = document.getElementById('decoderInfo');
                if ('BarcodeDetector' in window) {
                    decoderInfo.textContent = '✅ 当前使用 BarcodeDetector（浏览器原生）';
                    decoderInfo.style.color = '#28a745';
                } else {
                    decoderInfo.textContent = '⚠️ 当前使用 ZXing-JS（降级模式，首次使用需加载）';
                    decoderInfo.style.color = '#dc3545';
                }
            }
        }

        // 编码功能
        async function encodeText() {
            const text = document.getElementById('inputText').value;
            if (!text.trim()) {
                alert('请输入文本内容');
                return;
            }

            const enableCompression = document.getElementById('enableCompression').checked;
            const errorCorrection = document.getElementById('errorCorrection').value;
            const qrSize = parseInt(document.getElementById('qrSize').value);

            try {
                // 压缩文本
                let dataToEncode = text;
                let compressionRatio = 1;
                
                if (enableCompression) {
                    const compressed = LZString.compressToBase64(text);
                    if (compressed.length < text.length) {
                        dataToEncode = compressed;
                        compressionRatio = text.length / compressed.length;
                    }
                }

                // 根据纠错级别动态调整分片大小（QR码V40 Byte模式最大容量）
                // L(7%): ~2953字节, M(15%): ~2331字节, Q(25%): ~1663字节, H(30%): ~1273字节
                // Base64 + JSON元数据开销约80字节，留200字节安全余量
                const EC_BYTE_LIMITS = { L: 2700, M: 2100, Q: 1400, H: 1000 };
                const byteLimit = EC_BYTE_LIMITS[errorCorrection] || 2500;

                // 按 UTF-8 字节数分片（中文占3字节），而不是按字符数
                const encoder = new TextEncoder();
                const chunks = [];
                let chunkStart = 0;
                while (chunkStart < dataToEncode.length) {
                    // 逐步增加字符，直到接近字节限制
                    let chunkEnd = chunkStart + Math.ceil(byteLimit / 3); // 粗估起点
                    if (chunkEnd > dataToEncode.length) chunkEnd = dataToEncode.length;

                    let byteLen = encoder.encode(dataToEncode.slice(chunkStart, chunkEnd)).length;
                    // 如果超了，逐步回退
                    while (byteLen > byteLimit && chunkEnd > chunkStart + 1) {
                        chunkEnd--;
                        byteLen = encoder.encode(dataToEncode.slice(chunkStart, chunkEnd)).length;
                    }
                    // 如果单个字符就超了（不可能情况），也取一个字符
                    if (chunkEnd <= chunkStart) chunkEnd = chunkStart + 1;

                    chunks.push(dataToEncode.slice(chunkStart, chunkEnd));
                    chunkStart = chunkEnd;
                }

                // 生成带元数据的分片（全部使用ASCII，避免UTF-8字节膨胀）
                const qrDataList = chunks.map((chunk, index) => {
                    const metadata = {
                        v: 1,              // version
                        t: chunks.length,  // total
                        i: index,          // index
                        c: enableCompression && compressionRatio > 1 ? 1 : 0,  // compressed
                        d: chunk           // data
                    };
                    return JSON.stringify(metadata);
                });

                // 生成二维码
                const container = document.getElementById('qrContainer');
                container.innerHTML = '';

                // 必须在 qrcode() 构造之前设置 UTF-8 编码
                qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];

                // 固定模块像素尺寸，确保所有二维码视觉大小一致
                const fixedCellSize = 4;

                for (let i = 0; i < qrDataList.length; i++) {
                    const qr = qrcode(0, errorCorrection);
                    qr.addData(qrDataList[i], 'Byte');
                    qr.make();

                    const item = document.createElement('div');
                    item.className = 'qr-item';

                    const moduleCount = qr.getModuleCount();
                    const canvasSize = moduleCount * fixedCellSize;

                    const canvas = document.createElement('canvas');
                    canvas.width = canvasSize;
                    canvas.height = canvasSize;
                    canvas.style.width = qrSize + 'px';
                    canvas.style.height = qrSize + 'px';
                    const ctx = canvas.getContext('2d');

                    for (let row = 0; row < moduleCount; row++) {
                        for (let col = 0; col < moduleCount; col++) {
                            ctx.fillStyle = qr.isDark(row, col) ? '#000000' : '#ffffff';
                            ctx.fillRect(col * fixedCellSize, row * fixedCellSize, fixedCellSize, fixedCellSize);
                        }
                    }

                    item.appendChild(canvas);

                    const label = document.createElement('p');
                    label.textContent = `分片 ${i + 1} / ${qrDataList.length}`;
                    item.appendChild(label);
                    
                    container.appendChild(item);
                }

                // 显示统计信息
                const statsDiv = document.getElementById('encodeStats');
                statsDiv.style.display = 'flex';
                statsDiv.innerHTML = `
                    <div class="stat-item">
                        <div class="value">${text.length}</div>
                        <div class="label">原始字符数</div>
                    </div>
                    <div class="stat-item">
                        <div class="value">${dataToEncode.length}</div>
                        <div class="label">编码后字符数</div>
                    </div>
                    ${enableCompression && compressionRatio > 1 ? `
                    <div class="stat-item">
                        <div class="value">${compressionRatio.toFixed(2)}x</div>
                        <div class="label">压缩率</div>
                    </div>
                    ` : ''}
                    <div class="stat-item">
                        <div class="value">${qrDataList.length}</div>
                        <div class="label">二维码数量</div>
                    </div>
                `;

                // 显示下载按钮
                document.getElementById('encodeActions').style.display = 'block';

            } catch (error) {
                const errMsg = typeof error === 'string' ? error : (error.message || String(error));
                alert('编码失败: ' + errMsg);
            }
        }

        function clearEncode() {
            document.getElementById('inputText').value = '';
            document.getElementById('qrContainer').innerHTML = '';
            document.getElementById('encodeStats').style.display = 'none';
            document.getElementById('encodeActions').style.display = 'none';
        }

        // 下载所有二维码为JPG图片
        function downloadAllQR() {
            const qrItems = document.querySelectorAll('#qrContainer .qr-item');
            if (qrItems.length === 0) {
                alert('没有二维码可下载');
                return;
            }

            qrItems.forEach((item, index) => {
                const canvas = item.querySelector('canvas');
                if (canvas) {
                    // 转换为JPG
                    const jpgDataUrl = canvas.toDataURL('image/jpeg', 0.95);
                    
                    // 创建下载链接
                    const link = document.createElement('a');
                    link.download = `qrcode_${index + 1}.jpg`;
                    link.href = jpgDataUrl;
                    link.click();
                }
            });
        }

        // 解码功能
        let uploadedImages = [];

        // 拖拽支持
        const uploadArea = document.getElementById('uploadArea');
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        // 全局粘贴支持
        document.addEventListener('paste', (e) => {
            // 检查是否在解码面板
            const decodePanel = document.getElementById('decode-panel');
            if (!decodePanel.classList.contains('active')) {
                return; // 不在解码面板，不处理
            }

            const items = e.clipboardData.items;
            const imageFiles = [];

            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    const file = items[i].getAsFile();
                    if (file) {
                        imageFiles.push(file);
                    }
                }
            }

            if (imageFiles.length > 0) {
                e.preventDefault();
                handleFiles(imageFiles);
            }
        });

        function handleFiles(files) {
            const previewContainer = document.getElementById('previewContainer');
            
            Array.from(files).forEach(file => {
                if (!file.type.startsWith('image/')) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        uploadedImages.push(img);
                        
                        const item = document.createElement('div');
                        item.className = 'preview-item';
                        
                        const imgElem = document.createElement('img');
                        imgElem.src = e.target.result;
                        item.appendChild(imgElem);
                        
                        const removeBtn = document.createElement('button');
                        removeBtn.className = 'remove-btn';
                        removeBtn.textContent = '×';
                        removeBtn.onclick = () => {
                            const index = uploadedImages.indexOf(img);
                            if (index > -1) {
                                uploadedImages.splice(index, 1);
                                item.remove();
                            }
                        };
                        item.appendChild(removeBtn);
                        
                        previewContainer.appendChild(item);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function decodeImages() {
            if (uploadedImages.length === 0) {
                alert('请先上传图片');
                return;
            }

            const progressDiv = document.getElementById('decodeProgress');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const resultDiv = document.getElementById('decodeResult');
            
            progressDiv.style.display = 'block';
            resultDiv.innerHTML = '';

            const chunks = [];
            let hasCompression = false;
            let totalChunks = 0;

            for (let i = 0; i < uploadedImages.length; i++) {
                const img = uploadedImages[i];
                
                // 创建 canvas 用于解码
                const canvas = document.createElement('canvas');
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    console.log(`图片 ${i + 1} 解码成功:`, code.data.substring(0, 100));
                    try {
                        const metadata = JSON.parse(code.data);
                        if (metadata.v === 1) {
                            chunks[metadata.i] = metadata.d;
                            hasCompression = metadata.c === 1;
                            totalChunks = metadata.t;
                        }
                    } catch (e) {
                        // 尝试作为纯文本处理
                        console.log(`图片 ${i + 1} 不是JSON格式，作为纯文本处理`);
                        chunks.push(code.data);
                        totalChunks = chunks.length;
                    }
                } else {
                    console.error(`图片 ${i + 1} 无法识别二维码`);
                    resultDiv.innerHTML = `<div class="error">图片 ${i + 1} 无法识别二维码，请确保图片清晰完整</div>`;
                    return;
                }

                const progress = ((i + 1) / uploadedImages.length) * 100;
                progressFill.style.width = progress + '%';
                progressText.textContent = `正在解码: ${i + 1} / ${uploadedImages.length}`;
            }

            // 检查是否有缺失的分片
            const missingChunks = [];
            for (let i = 0; i < totalChunks; i++) {
                if (chunks[i] === undefined) {
                    missingChunks.push(i + 1);
                }
            }

            if (missingChunks.length > 0) {
                resultDiv.innerHTML = `<div class="error">缺失分片: ${missingChunks.join(', ')}</div>`;
                return;
            }

            // 重组数据
            const fullData = chunks.join('');
            console.log('重组数据长度:', fullData.length);
            console.log('是否压缩:', hasCompression);
            console.log('总分片数:', totalChunks);
            console.log('原始数据预览:', fullData.substring(0, 200));
            
            let finalText = fullData;

            // 解压
            if (hasCompression) {
                try {
                    finalText = LZString.decompressFromBase64(fullData);
                    console.log('解压后长度:', finalText ? finalText.length : 'null');
                    if (!finalText) {
                        // 解压失败，显示原始数据供调试
                        resultDiv.innerHTML = `
                            <div class="error">解压失败！可能原因：二维码数据被截断或损坏</div>
                            <div class="form-group" style="margin-top:20px;">
                                <label>原始数据（Base64）：</label>
                                <textarea id="rawData" rows="5" readonly>${fullData}</textarea>
                            </div>
                            <button class="btn" onclick="document.getElementById('rawData').select();document.execCommand('copy');alert('已复制')">📋 复制原始数据</button>
                        `;
                        return;
                    }
                } catch (e) {
                    resultDiv.innerHTML = `<div class="error">解压异常: ${e.message}<br>原始数据长度: ${fullData.length}</div>`;
                    return;
                }
            }

            // 检查最终结果
            if (!finalText || finalText.trim() === '') {
                resultDiv.innerHTML = `<div class="error">解码结果为空！请检查二维码是否完整</div>`;
                return;
            }

            // 显示结果
            progressText.textContent = '解码完成!';
            resultDiv.innerHTML = `
                <div class="success">✅ 成功解码 ${uploadedImages.length} 个二维码</div>
                <div class="form-group" style="margin-top:20px;">
                    <label>解码结果（${finalText.length} 字符）：</label>
                    <textarea id="outputText" rows="10" readonly>${finalText}</textarea>
                </div>
                <button class="btn" onclick="copyResult()">📋 复制文本</button>
                <button class="btn btn-secondary" onclick="downloadResult()">💾 下载文本</button>
            `;
        }

        function copyResult() {
            const outputText = document.getElementById('outputText');
            outputText.select();
            document.execCommand('copy');
            alert('已复制到剪贴板');
        }

        function downloadResult() {
            const text = document.getElementById('outputText').value;
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'decoded_text.txt';
            a.click();
            URL.revokeObjectURL(url);
        }

        function clearDecode() {
            uploadedImages = [];
            document.getElementById('previewContainer').innerHTML = '';
            document.getElementById('decodeProgress').style.display = 'none';
            document.getElementById('decodeResult').innerHTML = '';
        }

        // ========== 一图多码解码功能 ==========
        
        // 动态加载 ZXing-JS（仅在需要时加载）
        let zxingLoaded = false;
        async function loadZXing() {
            if (window.ZXing) {
                zxingLoaded = true;
                return window.ZXing;
            }
            
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'zxing.min.js';
                script.onload = () => {
                    zxingLoaded = true;
                    resolve(window.ZXing);
                };
                script.onerror = () => reject(new Error('ZXing 库加载失败，请检查网络连接'));
                document.head.appendChild(script);
            });
        }

        // 使用 BarcodeDetector 解码（Chrome/Edge 原生支持）
        async function decodeWithBarcodeDetector(img) {
            if (!('BarcodeDetector' in window)) return null;
            
            try {
                const detector = new BarcodeDetector({ formats: ['qr_code'] });
                const barcodes = await detector.detect(img);
                return barcodes.map(b => b.rawValue);
            } catch (e) {
                console.warn('BarcodeDetector 解码失败:', e);
                return null;
            }
        }

        // 使用 ZXing-JS 解码（降级方案，网格扫描）
        async function decodeWithZXing(img) {
            try {
                const ZXing = await loadZXing();
                
                const canvas = document.createElement('canvas');
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                const width = canvas.width;
                const height = canvas.height;
                const reader = new ZXing.QRCodeReader();
                const results = [];
                const seen = new Set();
                
                // 网格扫描：块大小 600px，重叠 100px（步长 500px）
                const blockSize = 600;
                const step = 500;
                
                for (let y = 0; y < height; y += step) {
                    for (let x = 0; x < width; x += step) {
                        const bw = Math.min(blockSize, width - x);
                        const bh = Math.min(blockSize, height - y);
                        
                        const blockCanvas = document.createElement('canvas');
                        blockCanvas.width = bw;
                        blockCanvas.height = bh;
                        const bctx = blockCanvas.getContext('2d');
                        bctx.drawImage(canvas, x, y, bw, bh, 0, 0, bw, bh);
                        
                        const imageData = bctx.getImageData(0, 0, bw, bh);
                        const grayBytes = new Uint8ClampedArray(bw * bh);
                        for (let i = 0; i < imageData.data.length; i += 4) {
                            grayBytes[i / 4] = (imageData.data[i] * 299 + imageData.data[i + 1] * 587 + imageData.data[i + 2] * 114) / 1000;
                        }
                        
                        try {
                            const source = new ZXing.RGBLuminanceSource(grayBytes, bw, bh);
                            const bitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(source));
                            const result = reader.decode(bitmap);
                            const text = result.getText();
                            if (!seen.has(text)) {
                                seen.add(text);
                                results.push(text);
                            }
                        } catch (e) {
                            // 该块未识别二维码，继续
                        }
                    }
                }
                
                return results.length > 0 ? results : null;
            } catch (e) {
                console.warn('ZXing 解码失败:', e);
                return null;
            }
        }

        // 一图多码解码主函数
        async function decodeMultiQR() {
            if (uploadedImages.length === 0) {
                alert('请先上传图片');
                return;
            }

            const progressDiv = document.getElementById('decodeProgress');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const resultDiv = document.getElementById('decodeResult');
            
            progressDiv.style.display = 'block';
            resultDiv.innerHTML = '';
            progressText.textContent = '正在初始化解码器...';

            const allResults = []; // 存储所有解码结果
            const hasBarcodeDetector = 'BarcodeDetector' in window;
            
            // 如果不支持 BarcodeDetector，预加载 ZXing
            if (!hasBarcodeDetector) {
                progressText.textContent = '正在加载 ZXing 解码库...';
                try {
                    await loadZXing();
                } catch (e) {
                    resultDiv.innerHTML = `<div class="error">${e.message}</div>`;
                    return;
                }
            }

            for (let i = 0; i < uploadedImages.length; i++) {
                const img = uploadedImages[i];
                progressText.textContent = `正在解码图片 ${i + 1} / ${uploadedImages.length}...`;
                
                let results = null;
                
                // 优先使用 BarcodeDetector
                if (hasBarcodeDetector) {
                    results = await decodeWithBarcodeDetector(img);
                }
                
                // 降级到 ZXing
                if (results === null) {
                    results = await decodeWithZXing(img);
                }
                
                if (results && results.length > 0) {
                    allResults.push({
                        imageIndex: i + 1,
                        codes: results
                    });
                } else {
                    console.warn(`图片 ${i + 1} 未识别二维码`);
                }

                const progress = ((i + 1) / uploadedImages.length) * 100;
                progressFill.style.width = progress + '%';
            }

            // 统计结果
            const totalCodes = allResults.reduce((sum, r) => sum + r.codes.length, 0);
            
            if (totalCodes === 0) {
                resultDiv.innerHTML = `<div class="error">未识别到任何二维码，请确保图片清晰完整</div>`;
                return;
            }

            // 解析分片数据
            const chunks = [];
            let hasCompression = false;
            let totalChunks = 0;
            let parseErrors = [];

            for (const result of allResults) {
                for (const code of result.codes) {
                    try {
                        const metadata = JSON.parse(code);
                        if (metadata.v === 1) {
                            chunks[metadata.i] = metadata.d;
                            hasCompression = metadata.c === 1;
                            totalChunks = metadata.t;
                        }
                    } catch (e) {
                        // 纯文本，直接保存
                        parseErrors.push({ image: result.imageIndex, data: code });
                    }
                }
            }

            // 检查是否有缺失的分片
            const missingChunks = [];
            for (let i = 0; i < totalChunks; i++) {
                if (chunks[i] === undefined) {
                    missingChunks.push(i + 1);
                }
            }

            // 重组数据
            let finalText = '';
            
            if (totalChunks > 0 && missingChunks.length === 0) {
                // 完整分片数据
                const fullData = chunks.join('');
                
                if (hasCompression) {
                    try {
                        finalText = LZString.decompressFromBase64(fullData);
                        if (!finalText) {
                            resultDiv.innerHTML = `<div class="error">解压失败！二维码数据可能被截断或损坏</div>`;
                            return;
                        }
                    } catch (e) {
                        resultDiv.innerHTML = `<div class="error">解压异常: ${e.message}</div>`;
                        return;
                    }
                } else {
                    finalText = fullData;
                }
            }

            // 显示结果
            progressText.textContent = '解码完成!';
            
            let resultHTML = `<div class="success">✅ 成功从 ${uploadedImages.length} 张图片中识别 ${totalCodes} 个二维码</div>`;
            
            if (finalText && finalText.trim() !== '') {
                resultHTML += `
                    <div class="form-group" style="margin-top:20px;">
                        <label>重组文本（${finalText.length} 字符）：</label>
                        <textarea id="multiOutputText" rows="10" readonly>${finalText}</textarea>
                    </div>
                    <button class="btn" onclick="copyMultiResult()">📋 复制文本</button>
                    <button class="btn btn-secondary" onclick="downloadMultiResult()">💾 下载文本</button>
                `;
            } else if (totalChunks > 0 && missingChunks.length > 0) {
                resultHTML += `<div class="error" style="margin-top:15px;">分片不完整，缺失: ${missingChunks.join(', ')}</div>`;
            }

            // 显示每个二维码的原始数据
            resultHTML += `
                <div style="margin-top:30px;">
                    <h4>解码详情：</h4>
                    <div style="max-height:400px;overflow-y:auto;margin-top:10px;">
            `;
            
            for (const result of allResults) {
                resultHTML += `<div style="margin:10px 0;padding:10px;background:#f8f9fa;border-radius:6px;">`;
                resultHTML += `<strong>图片 ${result.imageIndex}（${result.codes.length} 个二维码）：</strong>`;
                for (let i = 0; i < result.codes.length; i++) {
                    const preview = result.codes[i].substring(0, 100);
                    resultHTML += `<div style="margin:5px 0;padding:5px;background:white;border-radius:4px;font-family:monospace;font-size:12px;word-break:break-all;">[${i + 1}] ${preview}${result.codes[i].length > 100 ? '...' : ''}</div>`;
                }
                resultHTML += `</div>`;
            }
            
            resultHTML += `</div></div>`;
            
            resultDiv.innerHTML = resultHTML;
        }

        function copyMultiResult() {
            const outputText = document.getElementById('multiOutputText');
            outputText.select();
            document.execCommand('copy');
            alert('已复制到剪贴板');
        }

        function downloadMultiResult() {
            const text = document.getElementById('multiOutputText').value;
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'decoded_multi_text.txt';
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
